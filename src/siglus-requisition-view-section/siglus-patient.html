<div class="requisition-patient requisition-view-section">
    <table class="openlmis-table" ng-repeat="lineItem in vm.lineItems | orderBy : 'section.displayOrder'">
        <thead>
        <tr>
            <th colspan="2">{{lineItem.section.label}}</th>
        </tr>
        </thead>
        <tbody>
        <tr ng-repeat="column in lineItem.columns | orderObjectBy : 'displayOrder'">
            <td ng-class="{'grey-background': vm.isTotal(column)}" popover="{{column.definition}}" popover-trigger-area="element">{{column.label}}</td>

            <!-- Special case: Show adjustment value if the section is 'newSection7' -->
            <td ng-if="lineItem.name === 'newSection7'">
                {{vm.adjustmentValue}}
            </td>

            <!-- Default display conditions for all other sections -->
            <td ng-if="lineItem.name !== 'newSection7' && (!vm.canEdit || (vm.canEdit && !vm.isCalculated(column) && !vm.isUserInput(column) && !vm.isTotal(column)))">
                {{column.value}}
            </td>
            <td ng-if="lineItem.name !== 'newSection7' && vm.canEdit && vm.isCalculated(column)" openlmis-invalid="{{column.$error}}">
                {{vm.getTotal(lineItem, column)}}
            </td>
            <td ng-if="lineItem.name !== 'newSection7' && vm.canEdit && vm.isUserInput(column)"
                siglus-requisition-grid-cell
                line-item-field="column">
            </td>
        </tr>
        </tbody>
    </table>
</div>
